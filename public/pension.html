<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de la pensión — UniPensión Sincelejo</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header id="nav"></header>
  <main>
    <div id="mensaje"></div>
    <!-- HU-05: ficha detallada -->
    <section class="ficha">
      <div>
        <div class="panel">
          <h2 class="titulo" id="p-nombre">Cargando…</h2>
          <p class="suave" id="p-ubicacion"></p>
          <p class="estrellas" id="p-calificacion"></p>
          <div class="galeria" id="p-galeria" style="margin-top:12px"></div>
          <p id="p-descripcion" style="margin-top:14px"></p>
          <h3 style="margin-top:14px;color:var(--primario-osc)">Servicios incluidos</h3>
          <div id="p-servicios"></div>
          <h3 style="margin-top:14px;color:var(--primario-osc)">Reglas de convivencia</h3>
          <p id="p-reglas" class="suave"></p>
        </div>
        <div class="panel">
          <h2 class="titulo">Ubicación y distancia al campus</h2>
          <div id="mapa"></div>
          <ul id="p-distancias" style="margin:10px 0 0 18px"></ul>
        </div>
        <div class="panel">
          <h2 class="titulo">Reseñas de estudiantes</h2>
          <div id="p-resenas"></div>
          <!-- HU-10: formulario de reseña (solo con estadía finalizada) -->
          <form id="form-resena" style="display:none;margin-top:14px">
            <label>Tu calificación</label>
            <select id="r-estrellas"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select>
            <label style="margin-top:8px">Comentario</label>
            <textarea id="r-comentario" rows="3" placeholder="Cuéntales a otros estudiantes cómo fue tu estadía"></textarea>
            <button class="boton" style="margin-top:10px">Publicar reseña</button>
          </form>
          <p class="suave" id="r-nota"></p>
        </div>
      </div>

      <div>
        <!-- HU-06: solicitud de reserva + HU-05 esc. 2: costo estimado -->
        <div class="panel">
          <h2 class="titulo">Reservar un cupo</h2>
          <form id="form-reserva">
            <label>Habitación</label><select id="s-habitacion" required></select>
            <label style="margin-top:8px">Fecha de ingreso</label><input type="date" id="s-fecha" required>
            <label style="margin-top:8px">Duración (meses)</label>
            <input type="number" id="s-meses" min="1" max="12" value="6" required>
            <div class="aviso info" id="s-costo" style="margin-top:12px">Selecciona habitación y meses para ver el costo estimado.</div>
            <button class="boton" style="width:100%;margin-top:4px" type="submit">Continuar al pago</button>
          </form>
          <div id="s-mensaje"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="visor" id="visor"><img id="visor-img" alt="Vista ampliada"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pension.js"></script>
</body>
</html>
