<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — UniPensión Sincelejo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="nav"></header>
  <main style="max-width:480px">
    <section class="panel">
      <h2 class="titulo">Crear cuenta</h2>
      <!-- RF-01: registro con perfiles diferenciados -->
      <form id="form-registro">
        <label>Nombre completo</label><input id="r-nombre" required>
        <label style="margin-top:10px">Correo electrónico</label><input type="email" id="r-correo" required>
        <label style="margin-top:10px">Teléfono</label><input id="r-telefono" placeholder="300 000 0000">
        <label style="margin-top:10px">Contraseña</label><input type="password" id="r-clave" minlength="6" required>
        <label style="margin-top:10px">Quiero registrarme como</label>
        <select id="r-rol" required>
          <option value="estudiante">Estudiante (busco pensión)</option>
          <option value="propietario">Propietario (ofrezco habitaciones)</option>
        </select>
        <!-- RNF-07: Ley 1581 de 2012 -->
        <label style="margin-top:12px;font-weight:400">
          <input type="checkbox" id="r-datos" style="width:auto" required>
          Autorizo el tratamiento de mis datos personales conforme a la Ley 1581 de 2012.
        </label>
        <button class="boton" style="width:100%;margin-top:16px">Registrarme</button>
      </form>
      <div id="mensaje"></div>
      <p class="suave" style="margin-top:14px">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script>
    pintarNav('registro.html');
    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const { usuario } = await API.post('/auth/registro', {
          nombre: document.getElementById('r-nombre').value,
          correo: document.getElementById('r-correo').value,
          telefono: document.getElementById('r-telefono').value,
          clave: document.getElementById('r-clave').value,
          rol: document.getElementById('r-rol').value,
          acepta_datos: document.getElementById('r-datos').checked,
        });
        location.href = usuario.rol === 'propietario' ? 'propietario.html' : 'index.html';
      } catch (err) { aviso('mensaje', 'error', err.message); }
    });
  </script>
</body>
</html>
